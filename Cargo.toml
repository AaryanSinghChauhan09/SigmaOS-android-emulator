[package]
name = "sigmaos-android-emulator2"
version = "0.1.0"
edition = "2021"
description = "Android emulator profile manager for SigmaOS"
license = "MIT"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-android-emulator2"

[dependencies]

[lib]
name = "sigmaos_android_emulator2"
path = "src/lib.rs"

[[bin]]
name = "sigmaos-android-emulator2"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
